# Prix par défaut du budget : chaque jeudi (le Bulletin pétrolier UE du lundi est publié vers le mercredi),
# scripts/prix.mjs met à jour src/prix.json. Si un prix change : commit, puis déploiement (deploy.yml).
# Rien n'est demandé au visiteur : les prix sont figés dans le build (écoconception, aucune requête à l'exécution).
name: Prix

on:
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions:
  contents: write # commit de src/prix.json
  actions: write # lancer deploy.yml (un push fait avec GITHUB_TOKEN ne déclenche pas d'autre workflow)

jobs:
  prix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/prix.mjs
      - run: node --test src/prix.test.js
      - name: Commit et déploiement si un prix a changé
        run: |
          git diff --quiet src/prix.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "data(prix): mise à jour hebdomadaire des prix de l'énergie"
          git push
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
