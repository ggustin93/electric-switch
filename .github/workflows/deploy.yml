# Déploiement automatique chez Infomaniak (FTP) à chaque push sur main (ADR 0010).
# Les tests du modèle doivent passer avant toute mise en ligne.
# Prérequis (une fois), réglages du dépôt : secrets FTP_USER et FTP_PASSWORD (compte FTP du Manager Infomaniak),
# variables FTP_HOST (h2park-….infomaniak.ch, page FTP du Manager) et FTP_DIR (/ sur l'hébergement Starter).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # relance manuelle depuis l'onglet Actions

permissions:
  contents: read

concurrency: # un seul déploiement à la fois, jamais interrompu : un envoi FTP coupé laisserait un site à moitié à jour
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Domaine (ticket 08) : variables GitHub du dépôt, vide = https://electricornot.eu (src/seo.js)
          SITE_URL: ${{ vars.SITE_URL }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
      - run: sudo apt-get install -y -qq lftp
      - name: Envoyer dist/ chez Infomaniak (FTP)
        # Miroir : envoie dist/ et supprime en ligne ce qui n'y est plus, sauf les fichiers de l'hébergeur
        # (.ftpquota, .user.ini, .well-known/ de Let's Encrypt). Pas d'action tierce : le mot de passe ne quitte pas lftp.
        # FTP en clair : Starter n'offre pas de TLS (choix assumé, le compte n'ouvre qu'un site public ; ADR 0010).
        run: >-
          lftp -c "set ftp:ssl-allow false;
          open --env-password -u \"$FTP_USER\" \"$FTP_HOST\";
          mirror --reverse --delete --verbose --exclude-glob .ftpquota --exclude-glob .user.ini --exclude-glob .well-known/ dist/ \"$FTP_DIR\""
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_DIR: ${{ vars.FTP_DIR }}
      - name: Vérifier en HTTPS que le site en ligne est identique au build
        # FTP en clair : contenu altérable pendant l'envoi. Échoue si un fichier ou la CSP diffère (scripts/verifier-en-ligne.mjs).
        run: node scripts/verifier-en-ligne.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Signaler les URL à IndexNow
        if: vars.INDEXNOW_KEY != '' && vars.SITE_URL != ''
        run: node scripts/indexnow.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
